name: Bug report
description: Report a reproducible defect without sensitive payment data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, SDK keys, tokens, or real customer/transaction data. Security issues must use a private advisory.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [pesaraja CLI, daraja-rs, "@pesaraja/sdk", Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use only simulator or synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
