name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo package -p daraja-rs --locked

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - if: matrix.node-version == '24.x'
        run: npm pack -w @pesaraja/sdk --dry-run
      - if: matrix.node-version == '24.x'
        name: Smoke test packed SDK
        run: |
          smoke_dir="$(mktemp -d)"
          package_dir="$(mktemp -d)"
          npm pack -w @pesaraja/sdk --pack-destination "$package_dir"
          package_archive="$package_dir/$(ls "$package_dir")"
          npm install --prefix "$smoke_dir" "$package_archive"
          (cd "$smoke_dir" && node --input-type=module --eval 'const sdk = await import("@pesaraja/sdk"); if (!sdk.Daraja || !sdk.DarajaError) process.exit(1);')
      - if: matrix.node-version == '24.x'
        run: npm audit --omit=dev --audit-level=high

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sh -n install.sh
