name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
      confirm:
        description: Type publish to authorize npm publication
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run lint:package -w @pesaraja/sdk
      - name: Verify tag matches package
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(node -p \"require('./daraja-ts/package.json').version\")"
      - run: npm publish -w @pesaraja/sdk --access public --provenance
