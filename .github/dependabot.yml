version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps stay ungrouped and need manual review
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps stay ungrouped and need manual review
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
