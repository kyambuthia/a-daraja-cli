[graph]
all-features = true

[advisories]
# See .cargo/audit.toml for the rationale. RUSTSEC-2023-0071 is a private-key
# decryption timing sidechannel in `rsa`; this workspace only encrypts to a
# public key and has no fixed upstream upgrade available.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Mozilla CA root bundle data license, used by `webpki-roots` via reqwest.
  # Permissive, no copyleft obligations.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
