[package]
name = "cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line client for Safaricom Daraja and M-Pesa"
license = "MIT"
repository = "https://github.com/kyambuthia/pesaraja"
homepage = "https://github.com/kyambuthia/pesaraja"
publish = false

[[bin]]
name = "pesaraja"
path = "src/main.rs"

[dependencies]
daraja-rs = { path = "../daraja-rs" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1"
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
