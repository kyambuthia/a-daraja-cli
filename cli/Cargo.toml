[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pesaraja"
path = "src/main.rs"

[dependencies]
daraja-rs = { path = "../daraja-rs" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
zeroize = "1"
