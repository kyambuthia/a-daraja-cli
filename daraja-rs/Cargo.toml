[package]
name = "daraja-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Safe Rust primitives for Safaricom Daraja and M-Pesa APIs"
license = "MIT"
repository = "https://github.com/kyambuthia/a-daraja-cli"
homepage = "https://github.com/kyambuthia/a-daraja-cli"
readme = "README.md"
keywords = ["mpesa", "daraja", "payments", "kenya"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encryption & encoding
aes-gcm = "0.10"
base64 = "0.23"
rsa = { version = "0.9", features = ["pem"] }
# Security
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
# Idempotency
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
# Error handling
thiserror = "2"
# Time
chrono = "0.4"
x509-cert = { version = "0.2.5", features = ["pem"] }
url = "2"

[dev-dependencies]
rcgen = "0.14.8"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
